# Monthly: has any project's license file changed since we verified it, or has the SPDX License List moved on?
# Opens an issue (or comments on the open one) when something needs a human to re-read it. Read-only otherwise.

name: Monthly license re-check

on:
  schedule:
    - cron: "0 14 1 * *"  # 14:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no floating major tag

      - name: Compare each project's LICENSE file with the version we verified
        id: check
        run: uv run --no-project python maintenance/recheck_projects.py --out report.md

      - name: Open or update the re-check issue
        if: steps.check.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="License re-check: records to re-verify"
          number=$(gh issue list --state open --label data --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --label data --body-file report.md
          fi
