# Publish to PyPI when a GitHub Release is published. No token: PyPI trusts this workflow (Trusted Publishing),
# configured on PyPI for owner mfbaig35r, repository counselmode-license-navigator, workflow publish.yml and
# environment pypi. Create the release with a tag that matches the version in pyproject.toml (v2.13.3 for 2.13.3).

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Check the release tag matches the package version
        run: |
          version=$(uv version --short)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Lint and test
        run: |
          uv sync --locked --all-extras
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/counselmode-licenses/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
